name: Build tvOSBrowser IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Find Xcode project
      run: find . -name "*.xcodeproj" | head -5

    - name: Build for tvOS device
      run: |
        xcodebuild \
          -project _Project/tvOSBrowser.xcodeproj \
          -scheme tvOSBrowser \
          -configuration Release \
          -destination 'generic/platform=tvOS' \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM=""

    - name: Package as IPA
      run: |
        APP_PATH=$(find ./build -name "*.app" -path "*/Release-appletvos/*" | head -1)
        echo "Found app at: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r tvOSBrowser.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: tvOSBrowser-TrollStore
        path: tvOSBrowser.ipa
        retention-days: 14
